name: Sparko CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sparko-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Type-check application, tests, and tools
        run: npm run typecheck
      - name: Unit and API tests
        run: npm test
      - name: Production build
        run: npm run build

  browser:
    name: Browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify preinstalled Chrome and software rendering
        run: |
          # The hosted Ubuntu image supplies Chrome, Xvfb, and Xauth.
          # Our browser flags use Chrome's bundled SwiftShader, not Mesa.
          # Avoid redundant apt downloads consuming the browser-test timeout.
          google-chrome --version
          command -v xvfb-run
          command -v xauth
          test -r /opt/google/chrome/libvk_swiftshader.so
      - name: Browser tests
        # Linux WebGPU canvas capture needs a display compositor, even with software rendering.
        run: xvfb-run -a npm run test:e2e:ci -- --headed --shard=${{ matrix.shard }}/4
      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  quality:
    name: Sparko quality checks
    if: ${{ always() }}
    needs: [verify, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job and browser shard to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$BROWSER_RESULT" = success
