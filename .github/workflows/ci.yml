name: Sparko CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sparko-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Sparko quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Type-check application, tests, and tools
        run: npm run typecheck
      - name: Unit and API tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chrome and browser dependencies
        run: npx playwright install --with-deps chrome
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
